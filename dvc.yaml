stages:
  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw/train.csv
      - data/raw/store.csv
    params:
      - data.raw_dir
      - data.processed_dir
    outs:
      - data/processed/train_cleaned.csv

  feature_engineering:
    cmd: python src/feature_engineering.py
    deps:
      - src/feature_engineering.py
      - data/processed/train_cleaned.csv
    params:
      - data.processed_dir
      - data.features_dir
      - data.test_size
      - data.random_state
      - features
    outs:
      - data/features/train_features.csv
      - data/features/test_features.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/features/train_features.csv
    params:
      - train
    outs:
      - models/model.joblib
      - models/feature_names.json

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - data/features/test_features.csv
      - models/model.joblib
    metrics:
      - metrics/metrics.json:
          cache: false
    plots:
      - metrics/feature_importance.json:
          cache: false
